name: OPA policy tests

on:
  push:
  pull_request:

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test authorization policy
        run: docker run --rm -v "${{ github.workspace }}/opa/policy:/policy:ro" openpolicyagent/opa:1.21.1 test -v /policy
