# NovaTech Zero Trust Lab - Phase 3
# Identity, OPA policy decisions, risk scoring, and two isolated apps.
# NOTE: secrets below are LAB-ONLY. Never reuse them anywhere real.

x-proxy-common: &proxy-common
  image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
  restart: unless-stopped
  depends_on:
    - keycloak

networks:
  idp-net:            # identity zone: Keycloak + proxies
  hr-net:             # HR zone: no internet, only reachable via the HR proxy
    internal: true
  finance-net:        # Finance zone: no internet, only reachable via the Finance proxy
    internal: true
  posture-net:        # Local host bridge for the Windows posture agent -> risk service
  hr-edge-net:        # Loopback-published TLS edge for HR
  finance-edge-net:   # Loopback-published TLS edge for Finance
  attack-net:         # Isolated network for the no-session attacker demo
    internal: true

volumes:
  audit-data:

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/novatech-realm.json:/opt/keycloak/data/import/novatech-realm.json:ro
    ports:
      - "8080:8080"
    networks:
      idp-net:
        aliases:
          - keycloak

  # ---------- Policy decision point ----------
  # OPA is reachable only by the two protected apps; it is not published to the host.
  opa:
    image: openpolicyagent/opa:1.21.1
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policy"]
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./opa/policy:/policy:ro
    networks:
      - hr-net
      - finance-net

  # Demo risk scores are in memory; the decision audit database persists in a volume.
  # This service is reachable only by the protected apps on their internal networks.
  risk-engine:
    build: ./risk-engine
    restart: unless-stopped
    environment:
      POSTURE_SHARED_SECRET: ${POSTURE_SHARED_SECRET:-lab-only-change-me}
    volumes:
      - audit-data:/data
    ports:
      - "127.0.0.1:8090:8090"
    networks:
      - hr-net
      - finance-net
      - posture-net

  # ---------- HR zone ----------
  hr-app:
    build: ./apps
    environment:
      APP_NAME: "HR Portal (salary data)"
      APP_RESOURCE: hr
      OPA_URL: http://opa:8181/v1/data/zerogate/authz/allow
      RISK_URL: http://risk-engine:8090
    depends_on:
      - opa
      - risk-engine
    networks:
      - hr-net

  hr-proxy:
    <<: *proxy-common
    command:
      - --provider=keycloak-oidc
      - --oidc-issuer-url=http://keycloak:8080/realms/novatech
      - --client-id=hr-app
      - --client-secret=hr-lab-secret
      - --redirect-url=https://localhost:4181/oauth2/callback
      - --upstream=http://hr-app:8000
      - --http-address=0.0.0.0:4180
      - --oidc-groups-claim=roles
      - --code-challenge-method=S256
      - --email-domain=*
      - --cookie-secret=0123456789abcdef0123456789abcdef
      - --cookie-secure=true
      - --reverse-proxy=true
      - --cookie-name=_hr_session
      - --skip-provider-button=true
      - --pass-user-headers=true
      - --set-xauthrequest=true
    networks:
      - idp-net
      - hr-net

  hr-gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - hr-proxy
    ports:
      - "127.0.0.1:4181:8443"
    volumes:
      - ./gateways/hr.Caddyfile:/etc/caddy/Caddyfile:ro
      - ./pki/generated/ca.crt:/pki/ca.crt:ro
      - ./pki/generated/server.crt:/pki/server.crt:ro
      - ./pki/generated/private/server.key:/pki/server.key:ro
    networks:
      - hr-net
      - hr-edge-net

  # ---------- Finance zone ----------
  finance-app:
    build: ./apps
    environment:
      APP_NAME: "Finance App (payments)"
      APP_RESOURCE: finance
      OPA_URL: http://opa:8181/v1/data/zerogate/authz/allow
      RISK_URL: http://risk-engine:8090
    depends_on:
      - opa
      - risk-engine
    networks:
      - finance-net

  finance-proxy:
    <<: *proxy-common
    command:
      - --provider=keycloak-oidc
      - --oidc-issuer-url=http://keycloak:8080/realms/novatech
      - --client-id=finance-app
      - --client-secret=finance-lab-secret
      - --redirect-url=https://localhost:4182/oauth2/callback
      - --upstream=http://finance-app:8000
      - --http-address=0.0.0.0:4180
      - --oidc-groups-claim=roles
      - --code-challenge-method=S256
      - --email-domain=*
      - --cookie-secret=fedcba9876543210fedcba9876543210
      - --cookie-secure=true
      - --reverse-proxy=true
      - --cookie-name=_finance_session
      - --skip-provider-button=true
      - --pass-user-headers=true
      - --set-xauthrequest=true
    networks:
      - idp-net
      - finance-net

  finance-gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - finance-proxy
    ports:
      - "127.0.0.1:4182:8443"
    volumes:
      - ./gateways/finance.Caddyfile:/etc/caddy/Caddyfile:ro
      - ./pki/generated/ca.crt:/pki/ca.crt:ro
      - ./pki/generated/server.crt:/pki/server.crt:ro
      - ./pki/generated/private/server.key:/pki/server.key:ro
    networks:
      - finance-net
      - finance-edge-net

  # ---------- Attacker (lab-only demo) ----------
  # Plays an outsider with no valid session, isolated from all protected zones.
  # Not started by `docker compose up`; run on demand with:
  #   docker compose --profile attack run --rm attacker
  attacker:
    build: ./attacker
    profiles: ["attack"]
    depends_on:
      - hr-proxy
      - finance-proxy
    networks:
      - attack-net
